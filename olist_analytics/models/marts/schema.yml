version: 2

models:
  - name: fct_orders
    description: One row per order with value, payment, review and delivery metrics. Incremental with a lookback window.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: The real person who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: review_score
        description: Score (1 to 5) of the latest review for the order, if any.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: total_payment_value
        description: Sum of all payments for the order.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_delivered_late
        description: True when delivered after the estimated date. Null if not delivered.

  - name: dim_customers
    description: One row per real customer (customer_unique_id), with order history and latest location.
    columns:
      - name: customer_unique_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: order_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: is_repeat_customer
        description: True when the customer has more than one delivered order.
        
  - name: dim_products
    description: One row per product, with English category names. Products with no category map to unknown.
    columns:
      - name: product_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: category_name_english
        data_tests: [not_null]

  - name: dim_sellers
    description: One row per seller with location and region.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['North', 'Northeast', 'Central-West', 'Southeast', 'South']

  - name: fct_order_items
    description: One row per item in an order. Grain is order_id plus order_item_id.
    columns:
      - name: order_item_key
        description: Surrogate key built from order_id and order_item_id.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mart_category_revenue
    description: "{{ doc('revenue_definition') }}"
    columns:
      - name: category
        data_tests: [unique, not_null]
      - name: revenue_share_pct
        description: Category revenue as a percentage of total delivered revenue.

  - name: mart_delivery_performance_by_state
    description: Delivery speed, late rate and review score per customer state, delivered orders only.
    columns:
      - name: state
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['North', 'Northeast', 'Central-West', 'Southeast', 'South']
      - name: late_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_seller_performance
    description: One row per seller with revenue, delivery speed, late rate and review score. Filter on orders >= 30 before ranking.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]      