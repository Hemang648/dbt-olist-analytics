version: 2

models:
  - name: int_order_reviews_deduped
    description: One row per order, keeping the latest review.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_geolocation_by_zip
    description: One row per zip prefix with average coordinates.
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: int_order_payments_pivoted
    description: One row per order with payment totals and one column per payment type.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_items_agg
    description: One row per order with item counts and values.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_orders_enriched
    description: One row per order joining customer, items, payments and review data.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]